<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(0, 240, 255, 0.2)" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="100" r="140" fill="url(#glowGrad)" />
  <circle cx="1050" cy="260" r="160" fill="url(#glowGrad)" />

  <!-- Molecular Structure (Right Side Graphic) -->
  <g transform="translate(860, 60)" stroke="rgba(0, 240, 255, 0.35)" stroke-width="2">
    <!-- Benzene ring / Molecular graph -->
    <polygon points="120,40 180,75 180,145 120,180 60,145 60,75" fill="rgba(112, 0, 255, 0.12)" stroke="#00F0FF" stroke-width="2.5" />
    <circle cx="120" cy="40" r="7" fill="#00F0FF" filter="url(#glow)" />
    <circle cx="180" cy="75" r="7" fill="#38bdf8" />
    <circle cx="180" cy="145" r="7" fill="#818cf8" />
    <circle cx="120" cy="180" r="7" fill="#7000FF" filter="url(#glow)" />
    <circle cx="60" cy="145" r="7" fill="#38bdf8" />
    <circle cx="60" cy="75" r="7" fill="#818cf8" />

    <!-- Bonds to extra functional groups -->
    <line x1="180" y1="75" x2="240" y2="40" stroke="#00F0FF" stroke-width="2" />
    <circle cx="240" cy="40" r="8" fill="#ec4899" filter="url(#glow)" />
    <text x="255" y="45" font-family="'Fira Code', monospace" font-size="14" fill="#f472b6" font-weight="bold">OH</text>

    <line x1="120" y1="180" x2="120" y2="240" stroke="#7000FF" stroke-width="2" stroke-dasharray="4,4" />
    <circle cx="120" cy="240" r="9" fill="#a855f7" filter="url(#glow)" />
    <text x="135" y="245" font-family="'Fira Code', monospace" font-size="13" fill="#c084fc">SE(3)</text>

    <!-- Neural connection lines -->
    <path d="M 60 75 Q 0 100 20 180 T 120 180" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" stroke-dasharray="3,3" />
  </g>

  <!-- Left Side Scientific Typography & Accents -->
  <g transform="translate(80, 80)">
    <!-- Sub-badge -->
    <rect x="0" y="0" width="280" height="28" rx="14" fill="rgba(0, 240, 255, 0.08)" stroke="#00F0FF" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#00F0FF" filter="url(#glow)" />
    <text x="28" y="19" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">COMPUTATIONAL SCIENTIFIC AI</text>

    <!-- Main Title -->
    <text x="0" y="75" font-family="'Inter', -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Dhrub Chatterjee
    </text>

    <!-- Subtitle with Gradient -->
    <text x="0" y="115" font-family="'Fira Code', monospace" font-size="20" font-weight="600" fill="url(#accentCyan)">
      Chemical Engineering × Scientific ML × Autonomous Discovery
    </text>

    <!-- Domain Equations & Tags -->
    <g transform="translate(0, 150)" font-family="'Fira Code', monospace" font-size="13">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="220" height="32" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.3)" />
      <text x="14" y="21" fill="#93c5fd">∇²A ≥ 0 · ICNN Convexity</text>

      <!-- Tag 2 -->
      <rect x="235" y="0" width="240" height="32" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(168, 85, 247, 0.3)" />
      <text x="249" y="21" fill="#c084fc">SE(3) Equivariant SchNet</text>

      <!-- Tag 3 -->
      <rect x="490" y="0" width="210" height="32" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(236, 72, 153, 0.3)" />
      <text x="504" y="21" fill="#f472b6">BoTorch Self-Driving Lab</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="0" y1="358" x2="1200" y2="358" stroke="url(#accentCyan)" stroke-width="2" />
</svg>
